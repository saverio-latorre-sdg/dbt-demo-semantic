version: 2

semantic_models:
  # ---------------------------------------------------------
  # FACT: fct_orders
  # ---------------------------------------------------------
  - name: fct_orders
    description: "Modello semantico centrale basato sugli order line items."
    model: ref('fct_orders')
    
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order_item
        type: primary
        expr: order_item_key
      - name: sales_order  # Rinominato per evitare la parola riservata SQL 'order'
        type: foreign
        expr: order_key
      - name: customer
        type: foreign
        expr: customer_key
      - name: supplier
        type: foreign
        expr: supplier_key
      - name: part
        type: foreign
        expr: part_key

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: ship_date
        type: time
        type_params:
          time_granularity: day
      - name: receipt_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status_code
        type: categorical
      - name: order_priority_code
        type: categorical
      - name: return_flag
        type: categorical
      - name: line_status
        type: categorical
      - name: ship_mode
        type: categorical

    measures:
      - name: net_revenue_sum
        description: "Somma delle vendite nette (dopo gli sconti, prima delle tasse)."
        expr: net_item_sales_amount
        agg: sum
      - name: gross_revenue_sum
        description: "Somma delle vendite lorde (dopo sconti e tasse)."
        expr: gross_item_sales_amount
        agg: sum
      - name: quantity_sum
        description: "Quantità totale degli articoli ordinati."
        expr: quantity
        agg: sum
      - name: order_count
        description: "Conteggio degli ordini univoci."
        expr: order_key
        agg: count_distinct
      - name: order_item_count
        description: "Conteggio delle righe d'ordine."
        expr: order_item_key
        agg: count
      - name: customers_count
        description: "Conteggio univoco dei clienti."
        expr: customer_key
        agg: count_distinct

  # ---------------------------------------------------------
  # DIMENSION: dim_customers
  # ---------------------------------------------------------
  - name: dim_customers
    description: "Modello semantico per i clienti e la loro geografia."
    model: ref('dim_customers')
  
    primary_entity: customer
    
    entities:
      - name: customer
        type: natural
        expr: customer_key

    dimensions:
      - name: market_segment
        type: categorical
      - name: customer_nation
        type: categorical
      - name: customer_region
        type: categorical
      - name: valid_from
        type: time
        expr: valid_from
        type_params:
          time_granularity: day
          validity_params:
            is_start: true
      - name: valid_to
        type: time
        expr: valid_to
        type_params:
          time_granularity: day
          validity_params:
            is_end: true

  # ---------------------------------------------------------
  # DIMENSION: dim_suppliers
  # ---------------------------------------------------------
  # dbt sl query --metrics total_net_revenue --group-by metric_time__month,customer__customer_region --where "{{ TimeDimension('metric_time') }} = '2024-12-31'"
  - name: dim_suppliers
    description: "Modello semantico per i fornitori."
    model: ref('dim_suppliers')
    
    entities:
      - name: supplier
        type: primary
        expr: supplier_key

    dimensions:
      - name: supplier_nation
        type: categorical
      - name: supplier_region
        type: categorical

  # ---------------------------------------------------------
  # DIMENSION: dim_parts
  # ---------------------------------------------------------
  - name: dim_parts
    description: "Modello semantico per le parti/prodotti."
    model: ref('dim_parts')
    
    entities:
      - name: part
        type: primary
        expr: part_key

    dimensions:
      - name: manufacturer
        type: categorical
      - name: brand
        type: categorical
      - name: part_type
        type: categorical


# =========================================================
# METRICS
# =========================================================
metrics:
# 0. SIMPLE
  - name: total_net_revenue
    description: "Ricavi netti totali"
    label: "Total Net Revenue"
    type: simple
    type_params:
      measure: net_revenue_sum
    config:
      group: dbt-semantic-layer
      access: private

  - name: total_gross_revenue
    description: "Ricavi lordi totali"
    label: "Total Gross Revenue"
    type: simple
    type_params:
      measure: gross_revenue_sum
    config:
      group: dbt-semantic-layer
      access: private

  - name: total_orders
    description: "Numero totale di ordini univoci effettuati"
    label: "Total Orders"
    type: simple
    type_params:
      measure: order_count

  - name: total_quantity_sold
    description: "Quantità totale di prodotti venduti"
    label: "Total Quantity Sold"
    type: simple
    type_params:
      measure: quantity_sum

  - name: total_order_items
    description: "Numero totale di righe d'ordine elaborate"
    label: "Total Order Items"
    type: simple
    type_params:
      measure: order_item_count

  - name: average_order_value
    description: "Valore medio dell'ordine (Net Revenue / Numero di Ordini)"
    label: "Average Order Value (AOV)"
    type: derived
    type_params:
      expr: total_net_revenue / total_orders
      metrics:
        - name: total_net_revenue
        - name: total_orders

  - name: count_active_customers
    label: "Active Customers Number"
    description: "Conta il numero di clienti distinti che hanno effettuato almeno un ordine nel periodo selezionato."
    type: simple
    type_params:
      measure: customers_count

  # 1. CUMULATIVE: Valori aggregati nel tempo (es. YTD)
  # dbt sl query --metrics return_rate --where "{{ TimeDimension('metric_time') }} >= '2020-01-01' AND {{ TimeDimension('metric_time') }} <= '2025-03-31'"
  - name: ytd_net_revenue
    description: "Ricavi netti cumulati da inizio anno (Year-To-Date)."
    label: "YTD Net Revenue"
    type: cumulative
    type_params:
      measure: net_revenue_sum
      grain_to_date: year

  # 2. DERIVED: Calcoli matematici tra metriche esistenti
  # dbt sl query --metrics average_items_per_order --where "{{ TimeDimension('metric_time') }} >= '2020-01-01' AND {{ TimeDimension('metric_time') }} <= '2025-03-31'" --group-by customer__customer_nation
  - name: average_items_per_order
    description: "Numero medio di articoli venduti per singolo ordine."
    label: "Avg Items per Order"
    type: derived
    type_params:
      expr: total_quantity_sold / total_orders
      metrics:
        - name: total_quantity_sold
        - name: total_orders


  # 3. RATIO: Rapporto tra un numeratore e un denominatore
  - name: returned_orders
    description: "Numero di ordini che hanno subito un reso."
    label: "Returned Orders"
    type: simple
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order_item__return_flag') }} = 'returned'

  - name: return_rate
    description: "Percentuale di ordini resi rispetto al totale degli ordini."
    label: "Return Rate"
    type: ratio
    type_params:
      numerator: returned_orders
      denominator: total_orders
    config:
      group: dbt-semantic-layer
      access: private

  # 4. CONVERSION: Analisi di imbuto (Funnel) tra due eventi
  # dbt sl query --metrics customer_engagement_conversion --group-by customer__customer_nation,metric_time__month --where "{{ TimeDimension('metric_time') }} >= '2025-01-01' AND {{ TimeDimension('metric_time') }} <= '2025-12-31'"
  - name: customer_engagement_conversion
    description: "Tasso di conversione dei clienti che, una volta registrati/attivi, generano righe d'ordine entro 30 giorni."
    label: "Customer Engagement Conversion"
    type: conversion
    type_params:
      conversion_type_params:
        base_measure: customers_count
        conversion_measure: order_item_count
        entity: customer
        window: 30 days